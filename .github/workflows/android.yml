name: Build Boundary Cricket APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          unzip -q Boundary_Cricket_Android_CloudBuild.zip -d /tmp/bc
          cp -a /tmp/bc/Boundary_Cricket_Android/app .
          cp /tmp/bc/Boundary_Cricket_Android/settings.gradle .
          cp /tmp/bc/Boundary_Cricket_Android/build.gradle .
          cp /tmp/bc/Boundary_Cricket_Android/gradle.properties .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          arguments: assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Boundary-Cricket-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
