
name: Build Boundary Cricket APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          unzip -q Boundary_Cricket_Android_CloudBuild.zip -d /tmp/bc
          cp /tmp/bc/settings.gradle .
          cp /tmp/bc/build.gradle .
          cp /tmp/bc/gradle.properties .
          cp -r /tmp/bc/app .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Boundary-Cricket-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
